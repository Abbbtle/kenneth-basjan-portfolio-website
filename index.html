    <!-- The custom ring cursor (CustomCursor.jsx) replaces the system pointer on mouse and trackpad
         devices. This is inline so the pointer is hidden from the very first paint, not only once
         the app's JavaScript has loaded. -->
    <style>
      @media (hover: hover) and (pointer: fine) {
        html,
        html * {
          cursor: none !important;
        }

        html :is(input, textarea, select, [contenteditable]) {
          cursor: text !important;
        }
      }
    </style>
    <!-- Without JavaScript there's no ring, so keep the normal pointer. -->
    <noscript>
      <style>
        html,
        html * {
          cursor: auto !important;
        }
      </style>
    </noscript>
